services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthtech_backend_dev
    env_file:
      - .env.local
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
    networks:
      - healthtech-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthtech_frontend_dev
    env_file:
      - .env.local
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
    ports:
      - "3000:3000"
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0", "-p", "3000"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend
    networks:
      - healthtech-net

volumes:
  frontend_node_modules:
  frontend_next:

networks:
  healthtech-net:
    driver: bridge

